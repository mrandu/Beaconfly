name: BeaconFly
version: '1.3-rc1'
main: ee.mrandu.beaconfly.BeaconFlyPlugin
api-version: '1.21'

commands:
  beaconfly:
    description: Toggle beacon flight or reload its configuration
    usage: /beaconfly [on|off|sound <on|off>|reload]
    permission: beaconfly.use
    permission-message: You do not have permission to use this command.

permissions:
  beaconfly.use:
    description: Allows using the BeaconFly player commands.
    default: true
  beaconfly.reload:
    description: Allows reloading the BeaconFly configuration.
    default: op